name: Update lotto data

on:
  schedule:
    # 매주 토요일 20:35(KST) 추첨 → 22:00 KST에 수집, 일요일 09:00 KST에 한 번 더 시도
    - cron: '0 13 * * 6'
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest draws
        run: node scripts/update-lotto.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- public/lotto.json; then
            echo "변경 없음"
            exit 0
          fi
          LATEST=$(node -p "require('./public/lotto.json')[0].round")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/lotto.json
          git commit -m "chore: update lotto data (${LATEST}회)"
          git push
